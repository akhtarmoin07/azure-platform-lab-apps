services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmacy}
      POSTGRES_USER: ${POSTGRES_USER:-pharmacy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - application

  backend:
    build:
      context: apps/backend
    environment:
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-pharmacy}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-pharmacy}?sslmode=disable
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/backend", "healthcheck", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - application

  ui:
    build:
      context: apps/ui
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - application

volumes:
  postgres-data:

networks:
  application:
    driver: bridge
