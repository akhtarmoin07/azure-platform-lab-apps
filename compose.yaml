services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - application

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S database -U sa
        -P "$${MSSQL_SA_PASSWORD}" -C
        -Q "IF DB_ID(N'$${MSSQL_DATABASE}') IS NULL CREATE DATABASE [$${MSSQL_DATABASE}]"
    environment:
      MSSQL_DATABASE: ${MSSQL_DATABASE:-pharmacy}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - application

  migration:
    build:
      context: apps/backend
    command: ["migrate"]
    environment:
      DATABASE_DRIVER: sqlserver
      DATABASE_URL: sqlserver://sa:${MSSQL_SA_PASSWORD}@database:1433?database=${MSSQL_DATABASE:-pharmacy}&encrypt=true&TrustServerCertificate=true
    depends_on:
      database-init:
        condition: service_completed_successfully
    networks:
      - application

  backend:
    build:
      context: apps/backend
    environment:
      HTTP_ADDRESS: :8080
      DATABASE_DRIVER: sqlserver
      DATABASE_URL: sqlserver://sa:${MSSQL_SA_PASSWORD}@database:1433?database=${MSSQL_DATABASE:-pharmacy}&encrypt=true&TrustServerCertificate=true
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/backend", "healthcheck", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - application

  ui:
    build:
      context: apps/ui
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - application

volumes:
  mssql-data:

networks:
  application:
    driver: bridge
