name: Validate applications

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Verify formatting
        working-directory: apps/backend
        run: test -z "$(gofmt -l .)"

      - name: Vet backend
        working-directory: apps/backend
        run: go vet ./...

      - name: Test backend
        working-directory: apps/backend
        run: go test -race -coverprofile=coverage.out ./...

  containers:
    name: Build containers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag pharmacy-backend:ci apps/backend

      - name: Build UI image
        run: docker build --tag pharmacy-ui:ci apps/ui

  helm:
    name: Lint and render Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.4

      - name: Lint default values
        run: helm lint deploy/helm/pharmacy-platform

      - name: Render development release
        run: >-
          helm template pharmacy-dev deploy/helm/pharmacy-platform
          --namespace dev
          --values deploy/helm/pharmacy-platform/values-dev.yaml
          > /tmp/pharmacy-dev.yaml

      - name: Render production release
        run: >-
          helm template pharmacy-prod deploy/helm/pharmacy-platform
          --namespace prod
          --values deploy/helm/pharmacy-platform/values-prod.yaml
          > /tmp/pharmacy-prod.yaml

      - name: Render migration identity contract
        run: >-
          helm template pharmacy-dev deploy/helm/pharmacy-platform
          --namespace dev
          --values deploy/helm/pharmacy-platform/values-dev.yaml
          --set migration.enabled=true
          --set-string backend.image.tag=0123456789abcdef0123456789abcdef01234567
          --set migration.workloadIdentity.clientId=00000000-0000-0000-0000-000000000001
          > /tmp/pharmacy-migration.yaml

      - name: Verify migration reconciliation contract
        run: |
          grep -q 'argocd.argoproj.io/sync-wave: "-2"' /tmp/pharmacy-migration.yaml
          grep -q 'argocd.argoproj.io/sync-wave: "-1"' /tmp/pharmacy-migration.yaml
          grep -q 'name: pharmacy-schema-migration-0123456789ab-r0' /tmp/pharmacy-migration.yaml
          if grep -q 'Force=true' /tmp/pharmacy-migration.yaml; then
            echo 'Migration Job must not be forcibly rerun for configuration-only changes.'
            exit 1
          fi
