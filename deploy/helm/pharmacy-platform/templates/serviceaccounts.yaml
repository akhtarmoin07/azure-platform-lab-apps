apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    {{- include "pharmacy-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.backend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui
  labels:
    {{- include "pharmacy-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
automountServiceAccountToken: false
{{- if .Values.database.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: database
  labels:
    {{- include "pharmacy-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
automountServiceAccountToken: false
{{- end }}
