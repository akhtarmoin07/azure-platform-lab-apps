apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.backend.workloadIdentity.serviceAccountName }}
  labels:
    {{- include "pharmacy-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- if .Values.backend.workloadIdentity.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.backend.workloadIdentity.clientId | quote }}
  {{- end }}
automountServiceAccountToken: false
---
{{- if .Values.migration.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.migration.workloadIdentity.serviceAccountName }}
  labels:
    {{- include "pharmacy-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    azure.workload.identity/client-id: {{ required "migration.workloadIdentity.clientId is required when migration is enabled" .Values.migration.workloadIdentity.clientId | quote }}
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui
  labels:
    {{- include "pharmacy-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
automountServiceAccountToken: false
