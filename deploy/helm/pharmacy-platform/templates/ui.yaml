apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    {{- include "pharmacy-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "pharmacy-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "pharmacy-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: ui
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "pharmacy-platform.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: ui
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    {{- include "pharmacy-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  selector:
    {{- include "pharmacy-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
{{- if .Values.ui.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ui
  labels:
    {{- include "pharmacy-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  minAvailable: {{ .Values.ui.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "pharmacy-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
{{- end }}
