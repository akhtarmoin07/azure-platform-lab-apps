nameOverride: ""
fullnameOverride: ""

ui:
  replicas: 1
  image:
    repository: replace.azurecr.io/pharmacy-ui
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi
  pdb:
    enabled: false
    minAvailable: 1

backend:
  replicas: 1
  image:
    repository: replace.azurecr.io/pharmacy-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  database:
    driver: azuresql
    server: replace.database.windows.net
    name: pharmacy-dev
    fedAuth: ActiveDirectoryWorkloadIdentity
  workloadIdentity:
    enabled: true
    serviceAccountName: pharmacy-backend
    clientId: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 350m
      memory: 256Mi
  pdb:
    enabled: false
    minAvailable: 1

migration:
  enabled: false
  # Bump only when the same immutable image must retry a failed migration.
  retryRevision: 0
  workloadIdentity:
    serviceAccountName: pharmacy-migration
    clientId: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  privateEndpointCidr: 10.20.4.0/24
